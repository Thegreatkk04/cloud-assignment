# Task 1: k3d cluster config.  Create with:  k3d cluster create --config cluster/k3d.yaml
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cloud-mini
servers: 1
agents: 0
ports:
  - port: 8080:80          # Traefik ingress -> http://localhost:8080
    nodeFilters: [loadbalancer]
  - port: 8333:30333       # SeaweedFS S3 NodePort -> http://localhost:8333 (for laptop-side scripts)
    nodeFilters: [server:0]
options:
  k3d:
    wait: true
    timeout: 120s
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
