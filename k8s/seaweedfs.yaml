# Task 1: single-pod SeaweedFS (master + volume + filer + S3 gateway) in namespace data.
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: data}
spec:
  replicas: 1
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.73
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-filer", "-ip=seaweedfs", "-master.volumeSizeLimitMB=256"]
          ports:
            - {containerPort: 8333, name: s3}
            - {containerPort: 9333, name: master}
            - {containerPort: 8888, name: filer}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: data}
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
    - {name: master, port: 9333, targetPort: 9333}
    - {name: filer, port: 8888, targetPort: 8888}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs-s3-nodeport, namespace: data}
spec:
  type: NodePort
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333, nodePort: 30333}
