# Task 1: indexed Job = two labelling workers running at the same time in namespace pipeline.
# JOB_COMPLETION_INDEX (0 and 1) becomes SHARD_INDEX.
apiVersion: batch/v1
kind: Job
metadata: {name: teacher-label, namespace: pipeline}
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: cloud-mini/worker:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
            - {name: SHARD_COUNT, value: "2"}
            - {name: OLLAMA_URL, value: "http://host.k3d.internal:11434"}
            - {name: TEACHER_MODEL, value: "phi3.5"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
