# Task 4: service Deployment in namespace app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: app
  labels: {app: parser}
spec:
  replicas: 2
  selector: {matchLabels: {app: parser}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata: {labels: {app: parser}}
    spec:
      containers:
        - name: parser
          image: cloud-mini/service:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: MODEL_URI, value: "s3://models/v1"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - {name: FAULT_INJECT, value: "0"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          envFrom:
            - secretRef: {name: s3-credentials}   # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
